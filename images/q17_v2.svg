<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" style="background: white; font-family: sans-serif;">
  <g transform="translate(100, 100)">
    <text x="500" y="50" font-size="36" font-weight="bold" text-anchor="middle">Gaussian Smoothing &amp; Sigma (σ)</text>
    
    <!-- Axis -->
    <line x1="100" y1="600" x2="900" y2="600" stroke="black" stroke-width="3"/>
    <line x1="500" y1="200" x2="500" y2="600" stroke="black" stroke-width="3"/>
    
    <!-- Small Sigma Curve -->
    <path d="M 100 600 Q 400 600 450 400 T 500 250 T 550 400 T 900 600" fill="none" stroke="#2563eb" stroke-width="6"/>
    <text x="350" y="300" font-size="24" fill="#2563eb" font-weight="bold">Small σ</text>
    <text x="350" y="330" font-size="18" fill="#2563eb">(Less Blur, keeps detail)</text>
    
    <!-- Large Sigma Curve -->
    <path d="M 100 600 Q 300 550 500 400 T 900 600" fill="none" stroke="#dc2626" stroke-width="6"/>
    <text x="750" y="450" font-size="24" fill="#dc2626" font-weight="bold">Large σ</text>
    <text x="750" y="480" font-size="18" fill="#dc2626">(More width, heavy Blur)</text>
    
    <!-- Box array visualization -->
    <g transform="translate(0, 700)">
      <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle">A larger kernel size or larger standard deviation (σ)</text>
      <text x="500" y="70" font-size="24" font-weight="bold" text-anchor="middle">spreads the smoothing weights over a wider area.</text>
    </g>
  </g>
</svg>