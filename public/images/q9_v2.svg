<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" style="background: white; font-family: sans-serif;">
  <g transform="translate(100, 100)">
    <text x="500" y="50" font-size="36" font-weight="bold" text-anchor="middle">Canny Edge Detection vs SIFT Features</text>
    
    <g transform="translate(50, 150)">
      <text x="200" y="0" font-size="28" font-weight="bold" fill="#dc2626" text-anchor="middle">Canny Edge Detector</text>
      <rect x="0" y="20" width="400" height="400" fill="#fef2f2" stroke="#dc2626" stroke-width="4" rx="10"/>
      <path d="M 100 200 Q 200 100 300 200 T 100 300" fill="none" stroke="#ef4444" stroke-width="8"/>
      <path d="M 50 100 L 350 350" fill="none" stroke="#ef4444" stroke-width="8" stroke-dasharray="10"/>
      
      <rect x="50" y="450" width="300" height="150" fill="none" stroke="#9ca3af" stroke-width="2" rx="5"/>
      <text x="200" y="480" font-size="18" font-weight="bold" text-anchor="middle">Steps:</text>
      <text x="200" y="510" font-size="16" text-anchor="middle">1. Gaussian derivatives</text>
      <text x="200" y="530" font-size="16" text-anchor="middle">2. Gradient magnitude</text>
      <text x="200" y="550" font-size="16" text-anchor="middle">3. Non-maximum suppression</text>
      <text x="200" y="570" font-size="16" text-anchor="middle">4. Hysteresis thresholding</text>
    </g>

    <g transform="translate(550, 150)">
      <text x="200" y="0" font-size="28" font-weight="bold" fill="#2563eb" text-anchor="middle">SIFT (Scale-Invariant Feature Transform)</text>
      <rect x="0" y="20" width="400" height="400" fill="#eff6ff" stroke="#2563eb" stroke-width="4" rx="10"/>
      
      <!-- Blob points with orientation vectors -->
      <circle cx="100" cy="150" r="15" fill="#3b82f6"/>
      <line x1="100" y1="150" x2="140" y2="120" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
      <circle cx="100" cy="150" r="30" fill="none" stroke="#3b82f6" stroke-width="2"/>
      
      <circle cx="300" cy="250" r="15" fill="#3b82f6"/>
      <line x1="300" y1="250" x2="260" y2="280" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
      <circle cx="300" cy="250" r="45" fill="none" stroke="#3b82f6" stroke-width="2"/>
      
      <circle cx="200" cy="100" r="15" fill="#3b82f6"/>
      <line x1="200" y1="100" x2="200" y2="60" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrow)"/>
      <circle cx="200" cy="100" r="20" fill="none" stroke="#3b82f6" stroke-width="2"/>
      
      <rect x="50" y="450" width="300" height="150" fill="none" stroke="#9ca3af" stroke-width="2" rx="5"/>
      <text x="200" y="480" font-size="18" font-weight="bold" text-anchor="middle">Steps:</text>
      <text x="200" y="510" font-size="16" text-anchor="middle">1. Scale-space extrema</text>
      <text x="200" y="530" font-size="16" text-anchor="middle">2. Keypoint localization</text>
      <text x="200" y="550" font-size="16" text-anchor="middle">3. Orientation assignment</text>
      <text x="200" y="570" font-size="16" text-anchor="middle">4. Descriptor calculation</text>
    </g>

  </g>
</svg>