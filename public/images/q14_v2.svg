<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" style="background: white; font-family: sans-serif;">
  <g transform="translate(100, 100)">
    <text x="500" y="50" font-size="36" font-weight="bold" text-anchor="middle">SVM &amp; The Kernel Trick</text>

    <g transform="translate(100, 200)">
      <text x="150" y="0" font-size="28" font-weight="bold" fill="#dc2626" text-anchor="middle">Original 2D Data</text>
      <rect x="0" y="20" width="300" height="300" fill="none" stroke="#9ca3af" stroke-width="4"/>
      
      <!-- Inner cluster -->
      <circle cx="150" cy="170" r="10" fill="blue"/>
      <circle cx="130" cy="150" r="10" fill="blue"/>
      <circle cx="170" cy="160" r="10" fill="blue"/>
      <circle cx="150" cy="130" r="10" fill="blue"/>
      
      <!-- Outer cluster -->
      <circle cx="50" cy="50" r="10" fill="red"/>
      <circle cx="80" cy="250" r="10" fill="red"/>
      <circle cx="250" cy="250" r="10" fill="red"/>
      <circle cx="250" cy="80" r="10" fill="red"/>
      <circle cx="150" cy="40" r="10" fill="red"/>
      
      <text x="150" y="360" font-size="20" text-anchor="middle">Not linearly separable</text>
      <text x="150" y="385" font-size="18" text-anchor="middle">(No straight line can divide them)</text>
    </g>

    <!-- Arrow -->
    <path d="M 420 370 Q 500 250 580 370" stroke="black" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <text x="500" y="280" font-size="24" font-weight="bold" text-anchor="middle">Kernel Trick</text>
    <text x="500" y="310" font-size="16" text-anchor="middle">Maps data to 3D via $phi(x)$</text>

    <g transform="translate(600, 200)">
      <text x="200" y="0" font-size="28" font-weight="bold" fill="#16a34a" text-anchor="middle">Transformed 3D Space</text>
      
      <!-- 3D projection box -->
      <path d="M 50 150 L 150 50 L 350 50 L 250 150 Z" fill="#f3f4f6" stroke="gray"/>
      <path d="M 50 300 L 150 200 L 350 200 L 250 300 Z" fill="#e5e7eb" stroke="gray"/>
      <path d="M 50 150 L 50 300" stroke="gray"/>
      <path d="M 250 150 L 250 300" stroke="gray"/>
      <path d="M 350 50 L 350 200" stroke="gray"/>

      <!-- Raised cluster -->
      <circle cx="200" cy="80" r="10" fill="blue"/>
      <circle cx="180" cy="60" r="10" fill="blue"/>
      <circle cx="220" cy="70" r="10" fill="blue"/>
      
      <!-- Separating Hyperplane -->
      <path d="M 0 120 L 400 120 L 400 150 L 0 150 Z" fill="rgba(34, 197, 94, 0.4)" stroke="#16a34a" stroke-width="2"/>
      
      <!-- Lower cluster -->
      <circle cx="100" cy="250" r="10" fill="red"/>
      <circle cx="130" cy="220" r="10" fill="red"/>
      <circle cx="300" cy="230" r="10" fill="red"/>
      
      <text x="200" y="360" font-size="20" font-weight="bold" text-anchor="middle">Hyperplane easily separates them</text>
    </g>
  </g>
</svg>