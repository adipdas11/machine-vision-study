<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" style="background: white; font-family: sans-serif;">
  <g transform="translate(100, 100)">
    <text x="500" y="50" font-size="36" font-weight="bold" text-anchor="middle">Feature Matching Process</text>
    
    <rect x="150" y="200" width="300" height="300" fill="#f3f4f6" stroke="#9ca3af" stroke-width="4" rx="10"/>
    <text x="300" y="180" font-size="24" font-weight="bold" text-anchor="middle">Image 1</text>
    <circle cx="210" cy="280" r="10" fill="#dc2626"/>
    <circle cx="380" cy="350" r="10" fill="#16a34a"/>
    <circle cx="250" cy="420" r="10" fill="#2563eb"/>
    
    <rect x="550" y="200" width="300" height="300" fill="#e5e7eb" stroke="#6b7280" stroke-width="4" rx="10" transform="matrix(0.9 0.1 -0.1 0.9 100 0)"/>
    <text x="750" y="180" font-size="24" font-weight="bold" text-anchor="middle">Image 2 (Rotated/Scaled)</text>
    
    <!-- Target matched points shifted due to rotation transform -->
    <circle cx="680" cy="350" r="10" fill="#dc2626"/>
    <circle cx="830" cy="430" r="10" fill="#16a34a"/>
    <circle cx="710" cy="480" r="10" fill="#2563eb"/>
    
    <!-- Connection lines -->
    <line x1="210" y1="280" x2="680" y2="350" stroke="#dc2626" stroke-width="3" stroke-dasharray="8"/>
    <line x1="380" y1="350" x2="830" y2="430" stroke="#16a34a" stroke-width="3" stroke-dasharray="8"/>
    <line x1="250" y1="420" x2="710" y2="480" stroke="#2563eb" stroke-width="3" stroke-dasharray="8"/>
    
    <rect x="250" y="650" width="500" height="150" fill="#fef08a" stroke="#ca8a04" stroke-width="2" rx="10"/>
    <text x="500" y="700" font-size="24" font-weight="bold" text-anchor="middle">Why matching is hard:</text>
    <text x="500" y="730" font-size="18" text-anchor="middle">• Occlusions • Scale &amp; Rotation changes</text>
    <text x="500" y="760" font-size="18" text-anchor="middle">• Lighting variation • Perspective distortion</text>
  </g>
</svg>