<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" style="background: white; font-family: sans-serif;">
  <g transform="translate(100, 100)">
    <text x="500" y="50" font-size="36" font-weight="bold" text-anchor="middle">K-Nearest Neighbors (KNN Classification)</text>
    
    <g transform="translate(100, 200)">
      <text x="200" y="0" font-size="28" font-weight="bold" fill="#dc2626" text-anchor="middle">Nearest Neighbor (k=1)</text>
      <!-- Noise sensitivity -->
      <rect x="0" y="20" width="400" height="400" fill="none" stroke="#9ca3af" stroke-width="4"/>
      <!-- Background regions -->
      <path d="M 0 20 L 400 20 L 400 420 L 0 420 Z" fill="#fee2e2" />
      <polygon points="200,20 400,20 400,220 300,420 200,420 50,300" fill="#e0f2fe" />
      
      <!-- Datapoints -->
      <circle cx="100" cy="150" r="10" fill="red"/>
      <circle cx="150" cy="250" r="10" fill="red"/>
      <circle cx="80" cy="350" r="10" fill="red"/>
      
      <circle cx="300" cy="100" r="10" fill="blue"/>
      <circle cx="350" cy="200" r="10" fill="blue"/>
      <circle cx="250" cy="300" r="10" fill="blue"/>
      
      <!-- Outlier -->
      <circle cx="120" cy="200" r="10" fill="blue"/>
      <circle cx="120" cy="200" r="15" fill="none" stroke="black" stroke-dasharray="4" stroke-width="2"/>
      
      <text x="200" y="460" font-size="20">Creates a strict boundary, isolating outliers.</text>
      <text x="200" y="480" font-size="20" font-weight="bold" fill="#dc2626">Highly susceptible to noise.</text>
    </g>

    <g transform="translate(600, 200)">
      <text x="200" y="0" font-size="28" font-weight="bold" fill="#16a34a" text-anchor="middle">K-Nearest Neighbors (k=5)</text>
      <rect x="0" y="20" width="400" height="400" fill="none" stroke="#9ca3af" stroke-width="4"/>
      <!-- Smooth boundary -->
      <path d="M 0 20 L 400 20 L 400 420 L 0 420 Z" fill="#fee2e2" />
      <polygon points="250,20 400,20 400,420 150,420" fill="#e0f2fe" />
      
      <!-- Target Point -->
      <circle cx="200" cy="250" r="10" fill="green"/>
      <circle cx="200" cy="250" r="100" fill="none" stroke="green" stroke-width="2" stroke-dasharray="8"/>
      <text x="200" y="230" font-size="18" fill="green" font-weight="bold" text-anchor="middle">Majority Vote!</text>
      
      <!-- Datapoints -->
      <circle cx="100" cy="150" r="10" fill="red"/>
      <circle cx="150" cy="250" r="10" fill="red"/>
      <circle cx="120" cy="300" r="10" fill="red"/>
      <circle cx="130" cy="220" r="10" fill="red"/>
      
      <circle cx="300" cy="100" r="10" fill="blue"/>
      <circle cx="250" cy="200" r="10" fill="blue"/>
      <circle cx="220" cy="280" r="10" fill="blue"/>
      <circle cx="270" cy="320" r="10" fill="blue"/>
      
      <text x="200" y="460" font-size="20">Averages the surrounding pool.</text>
      <text x="200" y="480" font-size="20" font-weight="bold" fill="#16a34a">Ignores bad noise points smoothly!</text>
    </g>
  </g>
</svg>