<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" style="background: white; font-family: sans-serif;">
  <g transform="translate(100, 100)">
    <text x="500" y="50" font-size="36" font-weight="bold" text-anchor="middle">Pinhole Camera Model (Cube Projection)</text>
    <line x1="100" y1="400" x2="900" y2="400" stroke="black" stroke-width="4" stroke-dasharray="8"/>
    <text x="900" y="380" font-size="20">Optical Axis</text>
    
    <!-- Source Cube -->
    <g transform="translate(700, 300)">
      <rect x="0" y="0" width="100" height="100" fill="none" stroke="blue" stroke-width="6"/>
      <rect x="30" y="-30" width="100" height="100" fill="none" stroke="lightblue" stroke-width="4"/>
      <line x1="0" y1="0" x2="30" y2="-30" stroke="blue" stroke-width="2"/>
      <line x1="100" y1="0" x2="130" y2="-30" stroke="blue" stroke-width="2"/>
      <line x1="0" y1="100" x2="30" y2="70" stroke="blue" stroke-width="2"/>
      <line x1="100" y1="100" x2="130" y2="70" stroke="blue" stroke-width="2"/>
      <text x="50" y="140" font-size="20" text-anchor="middle">3D Cube (d=1m)</text>
    </g>
    
    <!-- Pinhole Plane -->
    <line x1="450" y1="200" x2="450" y2="600" stroke="black" stroke-width="8"/>
    <circle cx="450" cy="400" r="10" fill="red"/>
    <text x="450" y="640" font-size="20" text-anchor="middle">Center of Projection (Pinhole)</text>
    
    <!-- Image Plane -->
    <line x1="200" y1="200" x2="200" y2="600" stroke="darkgreen" stroke-width="6"/>
    <text x="200" y="640" font-size="20" text-anchor="middle">Image Plane (f=1m)</text>
    
    <!-- Projection Rays -->
    <line x1="700" y1="300" x2="200" y2="500" stroke="gray" stroke-width="2"/>
    <line x1="700" y1="400" x2="200" y2="400" stroke="gray" stroke-width="2"/>
    <line x1="730" y1="270" x2="200" y2="480" stroke="lightgray" stroke-width="2"/>
    
    <!-- Projected Shape (Frustum) -->
    <g transform="translate(100, 300)">
      <rect x="100" y="0" width="100" height="100" fill="none" stroke="red" stroke-width="6"/>
      <rect x="120" y="20" width="60" height="60" fill="none" stroke="red" stroke-width="3"/>
      <line x1="100" y1="0" x2="120" y2="20" stroke="red" stroke-width="2"/>
      <line x1="200" y1="0" x2="180" y2="20" stroke="red" stroke-width="2"/>
      <line x1="100" y1="100" x2="120" y2="80" stroke="red" stroke-width="2"/>
      <line x1="200" y1="100" x2="180" y2="80" stroke="red" stroke-width="2"/>
      <text x="150" y="140" font-size="20" fill="red" text-anchor="middle">Inverted Frustum</text>
      <text x="150" y="170" font-size="16" fill="red" text-anchor="middle">(Square within square)</text>
    </g>
  </g>
</svg>